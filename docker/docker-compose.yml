x-node-common: &node-common
  # This is deliberately a fresh development image.  It does not reuse the
  # old `*-backup` image that the currently-running cluster uses.
  build:
    context: .
  image: ${IMAGE_NAME:-wzk-vllm-xcpu-dev:ubuntu24.04}
  restart: "no"
  volumes:
    - ${HF_CACHE_HOST_PATH:?set HF_CACHE_HOST_PATH in the selected env file}:/root/.cache/huggingface:rw
    - ${MODELSCOPE_CACHE_HOST_PATH:?set MODELSCOPE_CACHE_HOST_PATH in the selected env file}:/root/.cache/modelscope:rw
    - ${SHARED_HOST_PATH:?set SHARED_HOST_PATH in the selected env file}:/shared:rw
    - ${DEV_CODE_HOST_PATH:?set DEV_CODE_HOST_PATH in the selected env file}:/workspace:rw
    - ${CACHE_HOST_PATH:?set CACHE_HOST_PATH in the selected env file}:/cache:rw
    - ${SHM_HOST_PATH:-/dev/shm}:/dev/shm:rw
    - ./ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    - ./ssh/authorized_keys:/run/cluster-ssh/authorized_keys:ro
  cap_add:
    - SYS_PTRACE
    - PERFMON
  security_opt:
    - seccomp:unconfined
  ulimits:
    memlock: -1

services:
  c1:
    <<: *node-common
    container_name: ${CONTAINER_NAME_PREFIX:-wzk-vllm-xcpu-03}-c1
    hostname: node01
    networks:
      vllm: {aliases: [node01], ipv4_address: "${VLLM_SUBNET_PREFIX:-172.30.3}.11"}
    volumes:
      - ${HF_CACHE_HOST_PATH}:/root/.cache/huggingface:rw
      - ${MODELSCOPE_CACHE_HOST_PATH}:/root/.cache/modelscope:rw
      - ${SHARED_HOST_PATH}:/shared:rw
      - ${DEV_CODE_HOST_PATH}:/workspace:rw
      - ${CACHE_HOST_PATH}:/cache:rw
      - ${SHM_HOST_PATH:-/dev/shm}:/dev/shm:rw
      - ./ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - ./ssh/authorized_keys:/run/cluster-ssh/authorized_keys:ro
      - c1_ssh_hostkeys:/var/lib/ssh-hostkeys
  c2:
    <<: *node-common
    container_name: ${CONTAINER_NAME_PREFIX:-wzk-vllm-xcpu-03}-c2
    hostname: node02
    networks: {vllm: {aliases: [node02], ipv4_address: "${VLLM_SUBNET_PREFIX:-172.30.3}.12"}}
    volumes: ["${HF_CACHE_HOST_PATH}:/root/.cache/huggingface:rw", "${MODELSCOPE_CACHE_HOST_PATH}:/root/.cache/modelscope:rw", "${SHARED_HOST_PATH}:/shared:rw", "${DEV_CODE_HOST_PATH}:/workspace:rw", "${CACHE_HOST_PATH}:/cache:rw", "${SHM_HOST_PATH:-/dev/shm}:/dev/shm:rw", "./ssh/id_ed25519:/root/.ssh/id_ed25519:ro", "./ssh/authorized_keys:/run/cluster-ssh/authorized_keys:ro", "c2_ssh_hostkeys:/var/lib/ssh-hostkeys"]
